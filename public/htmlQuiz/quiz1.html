<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenPortal | 1º Quiz</title>

    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="../css/jogos.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="icon" href="../assets/images/Portal.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body onload="onloadEsconder()">

    <!--Header-->

    <div class="header">
      <div class="container">

        <ul class="navbar">
          <li class="agora">
            <a href="../dashboard/simulador.html"></a>
          </li>
          <li>
            <a href="../dashboard/cards.html">VOLTAR</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="login">
        <div id="pontuacaoEJogo">
            <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

            <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
                <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
                    <span class="width-fit-content">Quantidade de acertos: <span id="spanCertas"></span></span>
                    <span class="width-fit-content">Quantidade de erros: <span id="spanErradas"></span></span>
                </div>
                <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
                    <span id="pontuacaoFinal" class="width-fit-content">Pontuação Final:
                        <span id="spanPontuacaoFinal"></span>
                    </span>
                    <span id="msgFinal" class="width-fit-content"></span>
                </div>
            </div>

            <div id="jogo" class="width-fit-content flex-colunar border-secondary">

                <div id="infoQuestao" class="padding-8">
                    <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                        questões.</span>
                </div>

                <!-- span adicionado para aparecer imagem -->
                <span id="spanImagem">

                </span>

                <div id="perguntaDaQuestaoAtual" class="padding-8">
                    <span id="spanQuestaoExibida" class="text-bold"></span>
                </div>



                <div id="infoAlternativas" class="padding-8">
                    <span><em>Escolha uma opção dentre as abaixo:</em></span>
                </div>
                <div id="opcoes" class="flex-colunar padding-8">
                    <span>
                        <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                        <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                    </span>
                    <span>
                        <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                        <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                    </span>
                    <span>
                        <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                        <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                    </span>
                    <span>
                        <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                        <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                    </span>
                </div>

                <div id="botoes" class="flex-colunar padding-8">
                    <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                    <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                    <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
                    <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
                </div>

            </div>
        </div>
    </div>
    <!--footer inicio-->
    <div class="footerjogos">
        <h4>
            Feito com por Gustavo Menezes SPTech 2025 - Versão: 1.0.0<br>
        </h4>
    </div>
    <!--footer fim-->

</body>

</html>
<script>
    const listaDeQuestoes = [
    {
        imagem: `<img id="imagemQuestao" src="https://i0.wp.com/codigoespagueti.com/wp-content/uploads/2022/12/rick-y-morty.jpg" style="width: 35%; transform: translate(90%, 0%);"></img>`,
        pergunta: "Rick aparece do nada falando que está 22% mais amável, extremamente simpático e lhe tratando bem. Você:",
        alternativaA: "Rick superou seus traumas e finalmente a sua melancolia.",
        pontuacaoA: 5,
        alternativaB: "Rick passou pelo spa alienígena e retirou seu lado tóxico.",
        pontuacaoB: 10,
        alternativaC: "Rick está sendo gentil e simpático para pedir algo, cuidado.",
        pontuacaoC: 15,
        alternativaD: "Rick deixou um clone robô dele enquanto está fora.",
        pontuacaoD: 25
    },
    {
        imagem: `<img id="imagemQuestao" src="https://pm1.aminoapps.com/7566/27592e4f040ad70eb14a14f88ddb5ebf72f02b43r1-720-386v2_uhq.jpg"style="    width: 35%;
    transform: translate(90%, 0%);"></img>`,
        pergunta: "Você se depara com uma criatura indefesa, porém Rick pede para sair de perto o quanto antes. Você:",
        alternativaA: "Saio de perto, afinal não conheço a criatura.",
        pontuacaoA: 25,
        alternativaB: "Sei que a criatura não me machuca e faço um carinho antes de sair de perto.",
        pontuacaoB: 10,
        alternativaC: "Abraço a criatura.",
        pontuacaoC: 5,
        alternativaD: "Peço para Rick me explicar o porquê de sair de perto.",
        pontuacaoD: 15
    },
    {
        imagem: `<img id="imagemQuestao" src="https://image.tmdb.org/t/p/original/hY750JVvL7K9KQN9lcqPTqcUEkN.jpg"style="    width: 35%;
    transform: translate(90%, 0%);"></img>`,
        pergunta: "Rick te entrega um soro que promete aumentar sua inteligência em 50%, mas avisa que pode ter efeitos colaterais estranhos. Você:",
        alternativaA: "Bebo na hora, inteligência acima de tudo!",
        pontuacaoA: 25,
        alternativaB: "Pergunto mais sobre os riscos antes de tomar.",
        pontuacaoB: 15,
        alternativaC: "Recuso, prefiro não arriscar.",
        pontuacaoC: 10,
        alternativaD: "Bebo só depois de testar no cachorro.",
        pontuacaoD: 5
    },
    {
        imagem: `<img id="imagemQuestao" src="https://m.media-amazon.com/images/S/pv-target-images/2e299c103bea80d3fb9e144a9aeb09f9a19834b2a9bd353bc943fa5606635bcc.jpg" style="    width: 35%;
    transform: translate(90%, 0%);"></img>`,
        pergunta: "Durante uma missão, Rick desaparece misteriosamente e deixa um holograma com instruções confusas. Você:",
        alternativaA: "Sigo as instruções do holograma sem questionar.",
        pontuacaoA: 10,
        alternativaB: "Tento entender o contexto antes de agir.",
        pontuacaoB: 15,
        alternativaC: "Desisto e tento voltar para casa.",
        pontuacaoC: 5,
        alternativaD: "Uso a inteligência da situação para adaptar o plano e sobreviver.",
        pontuacaoD: 25
    }
    ]

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)

        // span adicionado para insercão de imagens nas questões
        document.getElementById("spanImagem").innerHTML = questaoAtual.imagem

        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
            alert("Atenção... a próxima é a ultima questão!")
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
        limparCoresBackgroundOpcoes()
    }

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual
        const options = document.getElementsByName("option"); // recupera alternativas no html
        let pontuacaoMarcada = 0 // variável para armazenar a pontuação da alternativa marcada

        options.forEach((option) => {
            if (option.checked) {
                // Descobre qual alternativa foi marcada e pega a pontuação
                if (option.value === "alternativaA") pontuacaoMarcada = questaoAtual.pontuacaoA;
                if (option.value === "alternativaB") pontuacaoMarcada = questaoAtual.pontuacaoB;
                if (option.value === "alternativaC") pontuacaoMarcada = questaoAtual.pontuacaoC;
                if (option.value === "alternativaD") pontuacaoMarcada = questaoAtual.pontuacaoD;
            }
        })

        pontuacaoFinal += pontuacaoMarcada;
        numeroDaQuestaoAtual++;
        document.getElementById("spanPontuacaoFinal").innerHTML = pontuacaoFinal;
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }


    function finalizarJogo() {
    let textoParaMensagemFinal = "";
    let classComCoresParaMensagemFinal = "";
    let resultadoPersonagem = "";
    let textoFInal = '';

    if (pontuacaoFinal <= 25) {
        resultadoPersonagem = `"Desintegrado em 5 minutos"`;
    } else if (pontuacaoFinal <= 50) {
        texto
        resultadoPersonagem = `"Jerry"`;
        textoFInal = `, você é alguém que pode ajudar mas com sérios riscos de de se perder durante a aventura.`;

    } else if (pontuacaoFinal <= 75) {
        resultadoPersonagem = `"Morty"`;
        textoFInal = ', você se daria bem em uma aventura com Rick!'
    } else {
        resultadoPersonagem = `"Aniquilação total"`;
        textoFInal = ', você com certeza saberia lidar com as adversidades e problemas das aventuras!'
    }

    textoParaMensagemFinal += "<br>Sua pontuação: " + pontuacaoFinal + " de 100 pontos.";

    document.getElementById('msgFinal').innerHTML = `${textoParaMensagemFinal} <br> Resultado: ${resultadoPersonagem}${textoFInal}`;
    document.getElementById('msgFinal').className = "width-fit-content " + classComCoresParaMensagemFinal;
    document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal;

    document.getElementById('jogo').classList.add("text-new-gray");

    btnProx.disabled = true;
    btnSubmeter.disabled = true;
    btnTentarNovamente.disabled = false;

        fetch("/quiz3/salvar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
        fkUsuario: sessionStorage.ID_USUARIO, // nome igual ao do banco
        fkQuiz: 1,
        resultado: pontuacaoFinal,
        descricao: resultadoPersonagem
    })
})
    .then(res => res.ok ? console.log("Resultado salvo!") : console.error("Erro ao salvar resultado"));

    }

</script>
