<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenPortal | Morty vs Rick</title>

    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="../css/jogos.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="icon" href="../assets/images/Portal.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <!--Header-->

    <div class="header">
      <div class="container">

        <ul class="navbar">
          <li class="agora">
            <a href="../dashboard/simulador.html"></a>
          </li>
          <li>
            <a href="../dashboard/cards.html">VOLTAR</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="login" id="paginaRick">
        <div class="jogo" id="rickJogo">
            <div class="instrucao">
                <h1>Houve um caos na cidadela e Morty's se rebeleram</h1>
                <p>Use as setas para se mover e espaço para atirar!</p>
                <button id="btnIniciar" onclick="coantagem()" style="width: auto; height: auto;">Inicializar pontuação</button>
                <span id="pontuacao">Aperte este botão apenas quando Inicializar o jogo</span>
            </div>
            <iframe id="tinyRick" src="https://flborrelli.github.io/rick-and-morty-game/" frameborder="1"></iframe>
            <div class="instrucao">
                <p>Aperte em Home para voltar para aba principal</p>
            </div>
        </div>
        <button id="btnIniciar" onclick="enviarTempo()" style="width: auto; height: auto; transform: translate(512%, 0%);">Enviar Pontuação</button>
    </div>
    <!--footer inicio-->
    <div class="footerjogos">
        <h4>
            Feito com por Gustavo Menezes SPTech 2025 - Versão: 1.0.0<br>
            link jogo: <a href="https://flborrelli.github.io/rick-and-morty-game/">jogo oficial</a>
        </h4>
    </div>
    <!--footer fim-->

</body>

</html>

<script>

    let tempoEmJogo = 0;
    let intervalo = 0
    function coantagem(){
        if(intervalo == 0){
            intervalo = setInterval(atualizarTempo, 1000);
        }
    }


    function atualizarTempo(){
        tempoEmJogo++;
        console.log(tempoEmJogo);
        document.getElementById('pontuacao').innerHTML = `Sua pontuação: ${tempoEmJogo}`
    }
    

    function enviarTempo() {
        // parar contagem
        if(intervalo != 0){
            clearInterval(intervalo);
            intervalo = 0;
        }
        fetch("/jogos/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fkUsuario: sessionStorage.ID_USUARIO,
                fkJogo: 2,
                pontos: tempoEmJogo
            })
        })
            .then(res => res.text())
            .then(msg => {
                console.log(msg);
            })
            .catch(err => {
                console.error("Erro ao enviar tempo:", err);
            });
            tempoEmJogo = 0;
            document.getElementById('pontuacao').innerHTML = `Sua pontuação: ${tempoEmJogo}`
    }


</script>
